<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Teamily">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<title>Teamily · AI Agent Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#101a33;
    --dim:#5c6880;
    --dimmer:#8b96ab;
    --card:rgba(255,255,255,.74);
    --card-2:rgba(255,255,255,.94);
    --line:rgba(16,26,51,.08);
    --line-2:rgba(16,26,51,.14);
    --shadow:0 10px 30px rgba(23,37,84,.10);
    --shadow-lg:0 22px 50px rgba(23,37,84,.16);
    --violet:#7c5cff;
    --blue:#4f8cff;
    --cyan:#22d3ee;
    --pink:#ff7ab8;
    --amber:#ffb020;
    --mint:#2ec4a0;
    --grad:linear-gradient(135deg,#7c5cff 0%,#5b8bff 46%,#22d3ee 100%);
    --grad-2:linear-gradient(135deg,#ff7ab8 0%,#ff9d5c 100%);
    --grad-3:linear-gradient(135deg,#2ec4a0,#22d3ee);
    --r:22px;
  }
  html[data-theme="dark"]{
    --ink:#eef2ff;
    --dim:rgba(238,242,255,.66);
    --dimmer:rgba(238,242,255,.42);
    --card:rgba(24,28,45,.72);
    --card-2:rgba(30,35,56,.92);
    --line:rgba(255,255,255,.10);
    --line-2:rgba(255,255,255,.18);
    --shadow:0 14px 34px rgba(0,0,0,.42);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
    color:var(--ink);
    background:#eef2fb;
    overflow:hidden;
    transition:background .35s ease,color .35s ease;
  }
  html[data-theme="dark"] body{background:#080b14}

  /* ---------- ambient light ---------- */
  .bg{position:fixed;inset:-25%;z-index:0;filter:blur(70px) saturate(130%);pointer-events:none;opacity:.85}
  .blob{position:absolute;border-radius:50%;animation:drift 26s ease-in-out infinite}
  .b1{width:56vw;height:56vw;left:-12%;top:-10%;background:radial-gradient(circle at 35% 35%,#c7b8ff,#eef0ff 72%);opacity:.95}
  .b2{width:50vw;height:50vw;right:-14%;top:6%;background:radial-gradient(circle at 60% 40%,#b8e9ff,#eaf6ff 72%);animation-delay:-8s}
  .b3{width:48vw;height:48vw;left:6%;bottom:-16%;background:radial-gradient(circle at 40% 60%,#ffd0e6,#fff1f7 72%);animation-delay:-15s;opacity:.85}
  .b4{width:34vw;height:34vw;right:2%;bottom:4%;background:radial-gradient(circle at 50% 50%,#c9f7e4,#eefff9 72%);animation-delay:-5s;opacity:.8}
  html[data-theme="dark"] .bg{opacity:.55}
  html[data-theme="dark"] .b1{background:radial-gradient(circle at 35% 35%,#3d2a8f,#0a0e1c 72%)}
  html[data-theme="dark"] .b2{background:radial-gradient(circle at 60% 40%,#0d5b78,#080c18 72%)}
  html[data-theme="dark"] .b3{background:radial-gradient(circle at 40% 60%,#7c2a55,#0a0c18 72%)}
  html[data-theme="dark"] .b4{background:radial-gradient(circle at 50% 50%,#0f5a44,#080c18 72%)}
  @keyframes drift{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(4%,-5%,0) scale(1.07)}
    66%{transform:translate3d(-5%,4%,0) scale(.95)}
  }

  /* ---------- shell ---------- */
  .app{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding:0 16px}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 8px 4px;font-size:12.5px;font-weight:600;color:var(--dim);letter-spacing:.02em}
  .island{width:78px;height:22px;border-radius:14px;background:rgba(16,26,51,.9);box-shadow:inset 0 -1px 0 rgba(255,255,255,.18)}
  html[data-theme="dark"] .island{background:#000}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 4px 12px}
  .title{margin:0;font-size:29px;font-weight:800;letter-spacing:-1.1px;line-height:1.1}
  .sub{margin:5px 0 0;font-size:12.6px;color:var(--dim);font-weight:500}
  .actions{display:flex;gap:8px}

  .icon-btn{
    width:40px;height:40px;border-radius:14px;display:grid;place-items:center;cursor:pointer;
    background:var(--card-2);border:1px solid var(--line);color:var(--ink);
    font-size:17px;box-shadow:var(--shadow);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;
  }
  .icon-btn:active{transform:scale(.9)}

  /* ---------- gradient buttons ---------- */
  .btn{
    position:relative;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:13.4px;
    color:#fff;padding:11px 18px;border-radius:15px;background:var(--grad);
    box-shadow:0 10px 22px rgba(94,110,255,.32),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,filter .2s;
    display:inline-flex;align-items:center;gap:7px;letter-spacing:-.2px;
  }
  .btn:hover{filter:brightness(1.04)}
  .btn:active{transform:translateY(1px) scale(.965);box-shadow:0 4px 12px rgba(94,110,255,.28),inset 0 1px 0 rgba(255,255,255,.3)}
  .btn.pink{background:var(--grad-2);box-shadow:0 10px 22px rgba(255,122,184,.34),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.mint{background:var(--grad-3);box-shadow:0 10px 22px rgba(46,196,160,.32),inset 0 1px 0 rgba(255,255,255,.35)}
  .btn.soft{background:var(--card-2);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
  .btn.sm{padding:8px 13px;font-size:12.4px;border-radius:12px;box-shadow:0 6px 14px rgba(94,110,255,.26),inset 0 1px 0 rgba(255,255,255,.32)}
  .btn.block{width:100%;justify-content:center;padding:14px}
  .tapped{animation:tapGlow .55s ease-out}
  @keyframes tapGlow{
    0%{box-shadow:0 0 0 0 rgba(124,92,255,.5),0 10px 22px rgba(94,110,255,.32)}
    55%{box-shadow:0 0 0 12px rgba(124,92,255,.10),0 14px 30px rgba(94,110,255,.42)}
    100%{box-shadow:0 0 0 18px rgba(124,92,255,0),0 10px 22px rgba(94,110,255,.32)}
  }

  /* ---------- cards ---------- */
  .card{
    background:var(--card);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:var(--shadow);
  }
  .row{display:flex;align-items:center;gap:13px}
  .grow{flex:1;min-width:0}

  .face{
    width:50px;height:50px;flex:0 0 50px;border-radius:16px;display:grid;place-items:center;font-size:23px;
    color:#fff;box-shadow:0 8px 18px rgba(23,37,84,.18),inset 0 1px 0 rgba(255,255,255,.45);
  }
  .face.sm{width:38px;height:38px;flex:0 0 38px;border-radius:12px;font-size:18px}
  .face.xs{width:26px;height:26px;flex:0 0 26px;border-radius:9px;font-size:13px;margin-left:-8px;border:2px solid #fff}
  html[data-theme="dark"] .face.xs{border-color:#181c2d}

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 2px 126px;scrollbar-width:none}
  .scroll::-webkit-scrollbar{display:none}

  .sec{font-size:11.4px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);font-weight:800;margin:18px 5px 9px}
  .empty{text-align:center;color:var(--dim);font-size:13.4px;padding:38px 14px;line-height:1.6}

  .search{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:16px;margin-bottom:14px}
  .search input{flex:1;background:none;border:0;outline:none;color:var(--ink);font:inherit;font-size:14.2px;min-width:0}
  .search input::placeholder{color:var(--dimmer)}
  .search .mag{opacity:.45;font-size:15px}

  .tabs{display:flex;gap:5px;padding:5px;border-radius:17px;margin-bottom:14px}
  .tab{flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:12.8px;font-weight:700;
    padding:9px 4px;border-radius:13px;cursor:pointer;transition:.2s;white-space:nowrap}
  .tab.on{color:#fff;background:var(--grad);box-shadow:0 8px 18px rgba(94,110,255,.3),inset 0 1px 0 rgba(255,255,255,.3)}

  /* ---------- chat rows ---------- */
  .chatrow{-webkit-user-select:none;user-select:none;display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:19px;margin-bottom:10px;cursor:pointer;transition:transform .16s}
  .chatrow:active{transform:scale(.985)}
  .chatrow h4{margin:0 0 3px;font-size:14.6px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
  .chatrow p{margin:0;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:11px;color:var(--dimmer);white-space:nowrap;font-weight:600}
  .badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;margin-left:auto;box-shadow:0 4px 10px rgba(94,110,255,.4)}

  /* ---------- agent cards ---------- */
  .agent{padding:14px;border-radius:20px;margin-bottom:11px;cursor:pointer;transition:transform .16s}
  .agent:active{transform:scale(.99)}
  .agent h4{margin:0 0 3px;font-size:15px;font-weight:700;letter-spacing:-.2px}
  .agent p{margin:0;font-size:12.6px;line-height:1.5;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .chip{font-size:11.2px;font-weight:600;padding:4px 10px;border-radius:10px;background:rgba(124,92,255,.10);color:#6a4ff0;border:1px solid rgba(124,92,255,.16)}
  html[data-theme="dark"] .chip{background:rgba(124,92,255,.20);color:#c3b6ff;border-color:rgba(124,92,255,.3)}
  .chip.mint{background:rgba(46,196,160,.12);color:#17967a;border-color:rgba(46,196,160,.2)}
  html[data-theme="dark"] .chip.mint{background:rgba(46,196,160,.18);color:#6ee7c7}

  /* ---------- switches ---------- */
  .sw{width:46px;height:27px;border-radius:14px;border:0;padding:0;cursor:pointer;position:relative;flex:0 0 46px;
    background:rgba(16,26,51,.14);transition:background .24s,box-shadow .24s}
  .sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .24s cubic-bezier(.34,1.56,.64,1)}
  .sw.on{background:var(--grad);box-shadow:0 6px 14px rgba(94,110,255,.35)}
  .sw.on i{transform:translateX(19px)}

  /* ---------- artifact grid ---------- */
  .artgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .artcard{padding:13px;border-radius:19px;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;gap:10px}
  .artcard .ico{font-size:21px}
  .artcard b{font-size:13.2px;font-weight:700;line-height:1.35;display:block}
  .artcard span{font-size:11.2px;color:var(--dimmer);font-weight:600}
  .artcard:active{transform:scale(.98)}

  /* ---------- iOS top navigation bar ---------- */
  header.top{transition:padding .28s ease}
  header.top.compact{align-items:center;padding:2px 4px 6px}
  header.top.compact .title{font-size:17px;letter-spacing:-.4px}
  header.top.compact .sub{display:none}
  header.top.compact .icon-btn{width:34px;height:34px;border-radius:11px;font-size:15px}

  .topnav{position:relative;z-index:26;margin:0 -16px 10px;padding:2px 0 2px}
  .topnav::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(238,242,251,.92),rgba(238,242,251,.55) 70%,rgba(238,242,251,0));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none;opacity:0;transition:opacity .3s}
  html[data-theme="dark"] .topnav::before{background:linear-gradient(180deg,rgba(8,11,20,.92),rgba(8,11,20,.55) 70%,rgba(8,11,20,0))}
  .topnav.stuck::before{opacity:1}
  .segnav{position:relative;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 16px;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;scroll-behavior:smooth}
  .segnav::-webkit-scrollbar{display:none}
  .segnav button{border:1px solid var(--line);background:var(--card-2);color:var(--dim);font:inherit;font-weight:700;
    font-size:12.6px;letter-spacing:-.2px;padding:11px 16px;border-radius:16px;white-space:nowrap;cursor:pointer;flex:0 0 auto;
    display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(23,37,84,.06);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .24s,color .2s,background .24s,border-color .24s}
  .segnav button .g{font-size:13px;line-height:1;opacity:.85}
  .segnav button:active{transform:scale(.94)}
  .segnav button.on{color:#fff;background:var(--grad);border-color:transparent;
    box-shadow:0 10px 22px rgba(94,110,255,.34),inset 0 1px 0 rgba(255,255,255,.38)}
  .segnav button.on .g{opacity:1}
  .segnav button.live::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px rgba(46,196,160,.9);margin-left:1px}

  /* ---------- dock ---------- */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;
    width:min(452px,calc(100% - 32px));display:flex;justify-content:space-between;align-items:center;padding:8px 6px;border-radius:26px;
    background:var(--card-2);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid var(--line);box-shadow:var(--shadow-lg)}
  .dock button{border:0;background:none;color:var(--dimmer);font:inherit;font-size:10px;font-weight:700;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 7px;border-radius:16px;cursor:pointer;
    transition:.2s;position:relative;flex:1}
  .dock button .g{font-size:18px;line-height:1}
  .dock button.on{color:#5b46d6;background:rgba(124,92,255,.10)}
  html[data-theme="dark"] .dock button.on{color:#c3b6ff;background:rgba(124,92,255,.20)}
  .dock button:active{transform:scale(.9)}
  .dock .dot{position:absolute;top:3px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--pink);box-shadow:0 0 8px rgba(255,122,184,.8)}

  /* ---------- chat sheet ---------- */
  .sheet{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
    background:rgba(238,242,251,.86);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
    transform:translateY(100%);transition:transform .36s cubic-bezier(.32,.72,0,1);visibility:hidden}
  html[data-theme="dark"] .sheet{background:rgba(8,11,20,.88)}
  .sheet.open{transform:translateY(0);visibility:visible}
  .grab{width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:9px auto 0}
  .sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h3{margin:0;font-size:15.6px;font-weight:700;letter-spacing:-.2px}
  .st{font-size:11.6px;color:var(--mint);font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px}
  .st b{width:6px;height:6px;border-radius:50%;background:var(--mint);display:inline-block;box-shadow:0 0 8px rgba(46,196,160,.9)}
  .msgs{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;width:100%;scrollbar-width:none}
  .msgs::-webkit-scrollbar{display:none}
  .day{align-self:center;font-size:10.8px;font-weight:700;color:var(--dimmer);background:var(--card);padding:4px 12px;border-radius:10px;border:1px solid var(--line)}
  .msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;animation:pop .26s cubic-bezier(.34,1.56,.64,1);position:relative;word-wrap:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}to{opacity:1;transform:none}}
  .msg.them{align-self:flex-start;background:var(--card-2);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:0 6px 16px rgba(23,37,84,.07)}
  .msg.me{align-self:flex-end;color:#fff;border-bottom-right-radius:6px;background:var(--grad);box-shadow:0 8px 20px rgba(94,110,255,.30)}
  .msg .t{display:block;font-size:10.2px;opacity:.6;margin-top:5px;font-weight:600}
  .msg.me .t{color:rgba(255,255,255,.9)}
  .typing{align-self:flex-start;background:var(--card-2);border:1px solid var(--line);padding:13px 16px;border-radius:18px;border-bottom-left-radius:6px;display:flex;gap:4px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--dimmer);animation:bounce 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.16s}
  .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
  .quick{display:flex;gap:7px;padding:8px 16px 0;overflow-x:auto;max-width:520px;margin:0 auto;width:100%;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .quick button{white-space:nowrap;font:inherit;font-size:12.2px;font-weight:600;color:#5b46d6;
    background:rgba(124,92,255,.10);border:1px solid rgba(124,92,255,.18);padding:7px 13px;border-radius:12px;cursor:pointer;transition:.18s}
  .quick button:active{transform:scale(.95)}
  html[data-theme="dark"] .quick button{color:#c3b6ff;background:rgba(124,92,255,.2);border-color:rgba(124,92,255,.3)}
  .composer{display:flex;gap:9px;align-items:center;padding:10px 16px calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;width:100%}
  .composer input{flex:1;padding:14px 17px;border-radius:20px;border:1px solid var(--line);background:var(--card-2);
    color:var(--ink);font:inherit;font-size:14.4px;outline:none;box-shadow:var(--shadow);min-width:0}
  .composer input::placeholder{color:var(--dimmer)}
  .send{width:47px;height:47px;flex:0 0 47px;border-radius:50%;border:0;cursor:pointer;font-size:18px;color:#fff;
    background:var(--grad);box-shadow:0 10px 22px rgba(94,110,255,.4),inset 0 1px 0 rgba(255,255,255,.4);transition:.16s}
  .send:active{transform:scale(.9)}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(16,26,51,.34);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .24s}
  .modal.open{opacity:1;pointer-events:auto}
  .sheet2{width:min(480px,100%);max-height:88dvh;overflow-y:auto;background:var(--card-2);border:1px solid var(--line);
    border-radius:26px 26px 0 0;padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(24px);transition:transform .28s cubic-bezier(.32,.72,0,1);box-shadow:var(--shadow-lg)}
  .modal.open .sheet2{transform:none}
  .sheet2 h3{margin:4px 0 14px;font-size:18px;font-weight:800;letter-spacing:-.4px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.6px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--dimmer);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);
    background:rgba(255,255,255,.7);color:var(--ink);font:inherit;font-size:14px;outline:none;transition:.18s}
  html[data-theme="dark"] .field input,html[data-theme="dark"] .field textarea,html[data-theme="dark"] .field select{background:rgba(255,255,255,.06)}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(124,92,255,.55);box-shadow:0 0 0 4px rgba(124,92,255,.12)}
  .field textarea{min-height:88px;resize:vertical;line-height:1.55}

  .stat{padding:12px 10px;border-radius:17px;text-align:center}

<script>
/* ================= data ================= */
const KEY = 'teamily.v3';
const GRADS = [

  'linear-gradient(135deg,#8b5cf6,#ec4899)',
  'linear-gradient(135deg,#0ea5e9,#2dd4bf)',
  'linear-gradient(135deg,#f472b6,#a78bfa)'

function seedData(){
  const agents = [
    {id:'a9', name:'Grok', icon:'✦', role:'Grok assistant · default brain', g:2, pinned:true,

  const teams = [

    {id:'t2', name:'Content Engine', icon:'🎨', g:5, members:['a1','a3','a4'],

    {id:'t3', name:'Product Studio', icon:'🧩', g:2, members:['a5','a2','a8'],

  ];

  const automations = [

      prompt:'List today open visa tasks and missing documents.'},
    {id:'au2', name:'Weekly content calendar', when:'Every Monday · 08:00', agentId:'a1', on:true, last:'Mon 08:00',
      prompt:'Draft next week content calendar with 5 posts.'},
    {id:'au3', name:'New lead follow-up', when:'When a record is created', agentId:'a7', on:false, last:'Never',
      prompt:'Send a follow-up message with the document checklist.'}
  ];

  const chats = [
    {id:'c0', kind:'agent', ref:'a9', unread:1, updated: Date.now()-1000*60*1, messages:[
      {from:'them', text:'Grok is connected. Ask for anything: a plan, a draft, a fix, or a decision.', ts:Date.now()-1000*60*2},
      {from:'me', text:'What can you do first?', ts:Date.now()-1000*60*1},
      {from:'them', text:'Pick a section and I will run it: Chats for talk, Teams for group work, Automations for scheduled jobs, Artifacts for saved output.', ts:Date.now()-1000*60}
    ]},
    {id:'c1', kind:'agent', ref:'a7', unread:2, updated: Date.now()-1000*60*3, messages:[
      {from:'them', text:'Saudi Arabia visit visa checklist is ready. Want the file?', ts:Date.now()-1000*60*9},
      {from:'me', text:'Yes, send it.', ts:Date.now()-1000*60*6},
      {from:'them', text:'Passport valid 6+ months, white background photos, return ticket, hotel booking, 3 to 6 months bank statements, and a short cover letter. I saved it to Artifacts.', ts:Date.now()-1000*60*3}
    ]},
    {id:'c2', kind:'agent', ref:'a5', unread:1, updated: Date.now()-1000*60*42, messages:[
      {from:'them', text:'Light glass nav is pushed to the preview build. Shadow and press states are in.', ts:Date.now()-1000*60*44},
      {from:'me', text:'Looks good. Keep the gradient buttons.', ts:Date.now()-1000*60*42}
    ]},
    {id:'c3', kind:'agent', ref:'a1', unread:0, updated: Date.now()-1000*60*60*20, messages:[
      {from:'them', text:'Drafted 3 posts for launch week: teaser, proof story, requirement carousel.', ts:Date.now()-1000*60*60*20}
    ]},
    {id:'c4', kind:'Team', ref:'t1', unread:0, updated: Date.now()-1000*60*60*30, messages:[
      {from:'them', text:'Visa Launch Squad: checklist copy done, landing page in review, deck at 9 slides.', ts:Date.now()-1000*60*60*30}
    ]}
  ];

  const memories = [
    {id:'m1', k:'Business', v:'Runs visa and immigration services under the VisaMOTion 365 brand.'},
    {id:'m2', k:'Preference', v:'Prefers replies in Bengali written in romanised Bangla.'},
    {id:'m3', k:'Project', v:'Building Teamily, an AI agent team workspace with an iOS liquid glass UI.'},
    {id:'m4', k:'Working style', v:'Wants work finished end to end with a shareable live link.'}
  ];

  const artifacts = [
    {id:'ar1', icon:'🗂️', name:'Saudi visa checklist', meta:'Updated 3m ago',
      body:'Passport valid 6+ months\nWhite background photos 4x6\nReturn ticket\nHotel booking\n3 to 6 months bank statements\nCover letter\n\nStatus: ready to send to client.'},
    {id:'ar2', icon:'📈', name:'Launch metrics', meta:'Updated today',
      body:'Visitors 1,284\nChecklist downloads 312\nConsultation bookings 46\nConversion 3.6%'},
    {id:'ar3', icon:'🎬', name:'Storyboard v3', meta:'Updated Mon',
      body:'Act 1: the visa maze\nAct 2: the guided path\nAct 3: arrival\n\nSix scenes, 42 seconds total.'},
    {id:'ar4', icon:'🧾', name:'Pitch deck', meta:'9 slides',

  return {agents, teams, automations, chats, memories, artifacts,

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }

let db;
try{
  const raw = localStorage.getItem(KEY);
  db = raw ? JSON.parse(raw) : clone(seedData());
  if(!db || !db.agents) db = clone(seedData());
}catch(e){ db = clone(seedData()); }
if(!db.ui) db.ui = {view:'chats', theme:'light', atab:'agents'};

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){}
  try{ bc && bc.postMessage({type:'sync'}); }catch(e){}
}

let bc = null;
try{ bc = new BroadcastChannel('teamily-sync'); }catch(e){ bc = null; }
if(bc){
  bc.onmessage = e => {
    if(!e.data || e.data.type !== 'sync') return;
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    try{ db = JSON.parse(raw); }catch(err){ return; }
    render();
    if(chatOpen && document.getElementById('chatSheet').classList.contains('open')) renderMsgs();
  };
}
window.addEventListener('storage', e => {
  if(e.key !== KEY || !e.newValue) return;
  try{ db = JSON.parse(e.newValue); }catch(err){ return; }
  render();
  if(chatOpen) renderMsgs();
});

/* ================= helpers ================= */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function grad(i){ return GRADS[(i == null ? 0 : i) % GRADS.length]; }
function byId(list, id){ return list.find(x => x.id === id) || null; }

function timeShort(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function relTime(ts){
  const diff = Date.now() - ts;
  if(diff < 60000) return 'now';
  if(diff < 3600000) return Math.floor(diff/60000) + 'm';
  if(diff < 86400000) return Math.floor(diff/3600000) + 'h';
  if(diff < 604800000) return Math.floor(diff/86400000) + 'd';
  return new Date(ts).toLocaleDateString([], {month:'short', day:'numeric'});
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ================= real AI (bring your own key) ================= */
const AI_PRESETS = {
  xai:{label:'xAI Grok', url:'https://api.x.ai/v1/chat/completions', model:'grok-4'},
  openai:{label:'OpenAI', url:'https://api.openai.com/v1/chat/completions', model:'gpt-4o-mini'},
  anthropic:{label:'Anthropic', url:'https://api.anthropic.com/v1/messages', model:'claude-sonnet-4-5'},
  openrouter:{label:'OpenRouter', url:'https://openrouter.ai/api/v1/chat/completions', model:'x-ai/grok-4'},
  groq:{label:'Groq', url:'https://api.groq.com/openai/v1/chat/completions', model:'llama-3.3-70b-versatile'}
};
function aiCfg(){
  if(!db.ai) db.ai = {provider:'xai', key:'', model:''};
  return db.ai;
}
function aiReady(){
  const a = aiCfg();
  return !!(a.key && a.key.replace(/\s/g,'').length > 15);
}
function aiSystem(agent){
  const who = agent ? (agent.name + ' — ' + (agent.role || 'specialist') + '. ' + (agent.desc || '')) : 'the Teamily agent team';
  return 'You are ' + who + ' inside Teamily, a premium AI agent team app. Reply in the user language. Be concrete and practical, max 120 words. Use short lines, no markdown headings.';
}
async function aiReply(system, msgs){
  const a = aiCfg();
  const preset = AI_PRESETS[a.provider] || AI_PRESETS.xai;
  const model = (a.model || preset.model).trim();
  const history = msgs.slice(-12).map(m => ({role: m.from === 'me' ? 'user' : 'assistant', content: m.text}));
  let res;
  if(a.provider === 'anthropic'){
    res = await fetch(preset.url, {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':a.key.trim(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:model, max_tokens:900, system:system, messages:history})
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    return (j.content || []).map(x => x.text || '').join('\n').trim();
  }
  res = await fetch(preset.url, {
    method:'POST',
    headers:{'content-type':'application/json','authorization':'Bearer ' + a.key.trim()},
    body: JSON.stringify({model:model, temperature:0.7, messages:[{role:'system', content:system}].concat(history)})
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  return ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '').trim();
}

/* ================= replies ================= */
const RULES = [
  {re:/visa|passport|immigration|embassy|schengen|saudi|canada|australia|bangladesh/i, reply:
    'Here is the working checklist: passport valid 6+ months, white background photos, return ticket, hotel booking, 3 to 6 months bank statements, and a cover letter. I have saved it to Artifacts so you can share it. Want me to draft the cover letter next?'},
  {re:/content|post|caption|carousel|instagram|facebook|social/i, reply:
    'I would run three pieces: a teaser reel, a proof story from a real client, and a requirement carousel. That covers reach, trust and intent in one week. Say the word and I will write all three captions.'},
  {re:/video|edit|reel|short|hook/i, reply:
    'Open with a 3 second hook, cut on motion, and keep every shot under 1.8 seconds for retention. Add captions at 42px so it reads on mute. Want a shot list?'},
  {re:/image|photo|prompt|design|visual|logo/i, reply:
    'Try this prompt: "editorial portrait, soft window light, 85mm, shallow depth of field, muted teal palette, subtle film grain". Change only one variable at a time so you can compare results.'},
  {re:/deck|pitch|investor|fund/i, reply:
    'Nine slides works best: cover, problem, solution, product, traction, market, model, competition, ask. Put the ask last and make it one number. I can restructure your current deck into that shape.'},
  {re:/code|bug|build|app|website|frontend|deploy|github/i, reply:
    'I checked the build: all screens render, state saves to storage, and the gradient buttons keep their press glow. Push is on the feature branch. Tell me the next screen you want and I will wire it up.'},
  {re:/automation|reminder|schedule|daily|weekly/i, reply:
    'Automations are live. Open the Automations tab to switch one on, run it now, or add a new schedule with a prompt. Each run appends its result to the chat so you have a history.'},
  {re:/course|learn|module|teach|curriculum/i, reply:
    'Six modules with one practice task after each keeps completion high. Module 1 should deliver a small win in under 10 minutes. Want the full outline?'},
  {re:/hi|hello|hey|salam|assalam|kemon|ki obostha/i, reply:
    'Hey, I am here and ready. Tell me the task and I will take it end to end, then save the output to Artifacts.'},
  {re:/thanks|thank|ধন্যবাদ|dhonnobad/i, reply:
    'Anytime. Anything else you want finished today?'}
];

function replyFor(agentId, text){
  const a = byId(db.agents, agentId);
  for(const r of RULES){ if(r.re.test(text)) return r.reply; }
  const name = a ? a.name : 'your team';
  return 'Got it. As ' + name + ' I would start by breaking that into three concrete steps and doing the first one now. Shall I go ahead and save the result to Artifacts?';
}

/* ================= chrome ================= */
const TITLES = {
  chats:{t:'Chats', s:'Live agent conversations'},
  agents:{t:'Agents', s:'Your AI team'},
  teams:{t:'Agent Teams', s:'Agents working together'},
  automations:{t:'Automations', s:'Running on your behalf'},
  discover:{t:'Discover', s:'Add new specialists'},
  memory:{t:'Memory', s:'What your team knows'},
  artifacts:{t:'Artifacts', s:'Saved outputs'}
};

function applyTheme(){
  document.documentElement.setAttribute('data-theme', db.ui.theme === 'dark' ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = db.ui.theme === 'dark' ? '☀' : '☾';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', db.ui.theme === 'dark' ? '#080b14' : '#eef2fb');
}

function updateChrome(){
  const info = TITLES[uiView()] || TITLES.chats;
  document.getElementById('pageTitle').textContent = info.t;
  const unread = db.chats.reduce((n,c) => n + (c.unread || 0), 0);
  document.getElementById('pageSub').textContent = uiView() === 'chats' && unread
    ? unread + ' unread message' + (unread > 1 ? 's' : '')
    : info.s;
  const v = uiView();
  document.querySelectorAll('.dock button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const navOn = document.querySelector('.segnav button[data-view="' + v + '"]');
  document.querySelectorAll('.segnav button').forEach(b => b.classList.toggle('on', b === navOn));
  if(navOn){
    navOn.classList.toggle('live', v === 'automations' && db.automations.some(a => a.on));
    const bar = document.getElementById('segNav');
    if(bar){
      const target = navOn.offsetLeft - (bar.clientWidth - navOn.offsetWidth) / 2;
      bar.scrollTo({left:Math.max(0, target), behavior:'smooth'});
    }
  }
  const dockChats = document.querySelector('.dock button[data-view="chats"]');
  let dot = dockChats.querySelector('.dot');
  if(unread && !dot){
    dot = document.createElement('span'); dot.className = 'dot'; dockChats.appendChild(dot);
  } else if(!unread && dot){ dot.remove(); }
}

function uiView(){ return db.ui.view || 'chats'; }

/* ================= views ================= */
function agentFace(a, cls){
  return '<div class="face ' + (cls||'') + '" style="background:' + grad(a.g) + '">' + a.icon + '</div>';
}
function chatTitle(c){
  if(c.kind === 'Team'){
    const t = byId(db.teams, c.ref);
    return t ? {name:t.name, icon:t.icon, g:t.g} : {name:'Team', icon:'👥', g:0};
  }
  const a = byId(db.agents, c.ref);
  return a ? {name:a.name, icon:a.icon, g:a.g} : {name:'Agent', icon:'✦', g:0};
}

function chatsList(){
  const q = (db.ui.q || '').toLowerCase();
  const list = db.chats.slice().sort((x,y) => y.updated - x.updated).filter(c => {
    if(!q) return true;
    const t = chatTitle(c);
    const last = c.messages.length ? c.messages[c.messages.length-1].text : '';
    return (t.name + ' ' + last).toLowerCase().indexOf(q) >= 0;
  });
  if(!list.length) return '<div class="empty">No conversations yet.<br>Pick an agent and say hello.</div>';
  return list.map(c => {

let chatOpen = null;
let typingId = null;

function openChat(chatId){
  const c = byId(db.chats, chatId);
  if(!c) return;
  chatOpen = chatId;
  c.unread = 0;
  save();
  const t = chatTitle(c);

    ? (byId(db.teams, c.ref) ? byId(db.teams, c.ref).members.length + ' agents · team chat' : 'team chat')
    : 'online · replies instantly';
  document.getElementById('chatSheet').classList.add('open');
  renderMsgs();
  renderQuick(c);
  updateChrome();
}

function closeChat(){
  document.getElementById('chatSheet').classList.remove('open');
  chatOpen = null;
  typingId = null;
  document.getElementById('screen').scrollTop = 0;
  render();
}

function currentChat(){ return chatOpen ? byId(db.chats, chatOpen) : null; }

function renderMsgs(){
  const c = currentChat();
  const box = document.getElementById('msgs');
  if(!c){ box.innerHTML = ''; return; }
  let html = '<div class="day">' + new Date(c.updated).toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'}) + '</div>';
  html += c.messages.map(m =>
    '<div class="msg ' + (m.from === 'me' ? 'me' : 'them') + '">' + esc(m.text) +
    '<span class="t">' + timeShort(m.ts) + '</span></div>').join('');
  if(typingId === c.id) html += '<div class="typing"><i></i><i></i><i></i></div>';
  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;
}

function renderQuick(c){
  const ax = document.querySelector('.quick');
  const agentId = c.kind === 'Team' ? null : c.ref;
  const isVisa = agentId === 'a7';
  const picks = isVisa
    ? ['Checklist', 'Cover letter', 'Book appointment']
    : ['Give me a plan', 'Draft it now', 'Summarise'];
  ax.innerHTML = picks.map(p => '<button data-act="quick" data-text="' + esc(p) + '">' + esc(p) + '</button>').join('');
}

function sendMsg(textArg){
  const c = currentChat();
  if(!c) return;
  const inp = document.getElementById('msgInput');
  const text = (textArg != null ? textArg : inp.value).trim();
  if(!text) return;
  if(textArg == null) inp.value = '';
  c.messages.push({from:'me', text:text, ts:Date.now()});
  c.updated = Date.now();
  c.unread = 0;
  save();
  renderMsgs();
  const id = c.id;
  const isTeam = c.kind === 'Team';
  let responder = c.ref;
  if(isTeam){
    const team = byId(db.teams, c.ref);
    if(team && team.members.length){
      const mine = c.messages.filter(m => m.from === 'me').length;
      responder = team.members[mine % team.members.length];
    }
  }
  typingId = id;
  setTimeout(() => { if(chatOpen === id) renderMsgs(); }, 60);
  const delay = 700 + Math.random() * 700;
  setTimeout(async () => {
    const chat = byId(db.chats, id);
    if(!chat) return;
    let reply = '';
    if(aiReady()){
      try{
        reply = await aiReply(aiSystem(byId(db.agents, responder)), chat.messages);
      }catch(err){
        toast('AI ' + err.message + ' · offline reply used');
      }
    }
    if(!reply) reply = isTeam ? teamReply(responder, text) : replyFor(responder, text);
    chat.messages.push({from:'them', text:reply, ts:Date.now()});
    chat.updated = Date.now();
    if(chatOpen !== id) chat.unread = (chat.unread || 0) + 1;
    typingId = null;
    save();
    if(chatOpen === id) renderMsgs();
    if(chat.messages.length % 3 === 0) autoArtifact(responder, text);
  }, delay);
}

function teamReply(memberId, text){
  const m = byId(db.agents, memberId);
  const who = m ? m.name : 'The team';
  return who + ': ' + replyFor(memberId, text);
}

function autoArtifact(agentId, text){
  const a = byId(db.agents, agentId);
  db.artifacts.unshift({
    id: uid('ar'),
    icon: a ? a.icon : '✦',
    name: (a ? a.name : 'Agent') + ' output',
    meta: 'Just now',
    body: 'Request: ' + text + '\n\nSaved automatically from the conversation. Open to review, copy or share with the team.'
  });
  save();
  toast('Saved to Artifacts');
}

function newChat(){
  const opts = db.agents.map(a => ({v:a.id, l:a.name})).concat(db.teams.map(t => ({v:'team:' + t.id, l:t.name + ' (team)'})));
  openForm({
    title:'New chat',
    fields:[{name:'who', label:'Chat with', type:'select', options:opts}],
    submit:'Start chat',
    onSave:v => {
      let chat;
      if(String(v.who).indexOf('team:') === 0){
        const tid = String(v.who).slice(5);
        chat = db.chats.find(c => c.kind === 'Team' && c.ref === tid);
        if(!chat){
          chat = {id:uid('c'), kind:'Team', ref:tid, unread:0, updated:Date.now(), messages:[]};
          db.chats.push(chat);
        }
      } else {
        chat = db.chats.find(c => c.kind === 'agent' && c.ref === v.who);
        if(!chat){
          chat = {id:uid('c'), kind:'agent', ref:v.who, unread:0, updated:Date.now(), messages:[]};
          db.chats.push(chat);
        }
      }
      save(); render();
      setTimeout(() => openChat(chat.id), 60);
    }
  });
}

let formHandler = null;
function openForm(cfg){
  formHandler = cfg.onSave || null;
  const fields = (cfg.fields || []).map((f,i) => {
    const id = 'f_' + i;
    let input;
    if(f.type === 'textarea'){
      input = '<textarea id="' + id + '" placeholder="' + esc(f.ph || '') + '">' + esc(f.value || '') + '</textarea>';
    } else if(f.type === 'select'){
      input = '<select id="' + id + '">' + (f.options || []).map(o =>
        '<option value="' + esc(o.v) + '"' + (o.v === f.value ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>';
    } else {
      input = '<input id="' + id + '" type="' + (f.type || 'text') + '" value="' + esc(f.value || '') + '" placeholder="' + esc(f.ph || '') + '">';
    }
    return '<div class="field"><label>' + esc(f.label) + '</label>' + input + '</div>';
  }).join('');
  openModal('<h3>' + esc(cfg.title) + '</h3>' + fields +
    '<div class="mf-row"><button class="btn soft" data-act="closeModal">Cancel</button>' +
    '<button class="btn" data-act="formSave">' + esc(cfg.submit || 'Save') + '</button></div>');
  formHandler = {cfg:cfg, fields:(cfg.fields || [])};
}

function readForm(){
  const pack = formHandler;
  if(!pack || !pack.fields) return null;
  const out = {};
  pack.fields.forEach((f,i) => { out[f.name] = (document.getElementById('f_' + i).value || '').trim(); });
  return out;
}

function saveForm(){
  const pack = formHandler;
  const vals = readForm();
  if(!vals) return;
  const required = pack.fields.filter(f => !f.optional);
  for(const f of required){
    if(!vals[f.name]){ toast('Please fill in ' + f.label); return; }
  }
  const cb = pack.cfg.onSave;
  closeModal();
  formHandler = null;
  if(cb) cb(vals);
}

function runAuto(id){
  const a = byId(db.automations, id);
  if(!a) return;
  a.last = 'just now';
  save();
  let chat = db.chats.find(c => c.kind === 'agent' && c.ref === a.agentId);
  if(!chat){
    chat = {id:uid('c'), kind:'agent', ref:a.agentId, unread:0, updated:Date.now(), messages:[]};
    db.chats.push(chat);
  }
  chat.messages.push({from:'them', text:'Automation "' + a.name + '" ran: ' + (a.prompt || 'done'), ts:Date.now()});
  chat.updated = Date.now();
  chat.unread = (chat.unread || 0) + 1;
  save(); render();
  toast('Automation ran, result in chat');
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if(act === 'send' || act === 'nav' || act === 'atab' || act === 'quick'){
    el.classList.remove('tapped');
    void el.offsetWidth;
    el.classList.add('tapped');
  }

  switch(act){
    case 'nav': go(el.dataset.view); break;
    case 'theme':
      db.ui.theme = db.ui.theme === 'dark' ? 'light' : 'dark';
      save(); applyTheme(); toast(db.ui.theme === 'dark' ? 'Dark glass' : 'Light glass');
      break;
    case 'settings': openSettings(); break;
    case 'closeModal': closeModal(); break;
    case 'formSave': saveForm(); break;
    case 'openChat': openChat(id); break;
    case 'closeChat': closeChat(); break;
    case 'send': sendMsg(null); break;
    case 'quick': sendMsg(el.dataset.text); break;
    case 'chatAgent': chatWithAgent(id); break;
    case 'openTeam': {
      const t = byId(db.teams, id);
      if(!t) return;
      let chat = db.chats.find(c => c.kind === 'Team' && c.ref === id);
      if(!chat){
        chat = {id:uid('c'), kind:'Team', ref:id, unread:0, updated:Date.now(), messages:[]};
        db.chats.push(chat); save();
      }
      openChat(chat.id);
      break;
    }
    case 'atab': db.ui.atab = el.dataset.tab; save(); render(); break;
    case 'agentMenu': agentMenu(id); break;
    case 'teamMenu': teamMenu(id); break;
    case 'autoMenu': autoMenu(id); break;
    case 'memMenu': memMenu(id); break;
    case 'agentInfo': agentInfo(id); break;
    case 'newAgent': newAgentForm(); break;
    case 'newTeam': newTeamForm(); break;
    case 'newAuto': newAutoForm(); break;
    case 'newChat': newChat(); break;
    case 'newMemory': newMemoryForm(); break;
    case 'newArtifact': newArtifactForm(); break;
    case 'toggleAuto': {
      const a = byId(db.automations, id);
      if(!a) return;
      a.on = !a.on;
      save(); render();
      toast(a.on ? 'Automation on' : 'Automation paused');
      break;
    }
    case 'runAuto': runAuto(id); break;
    case 'cat': db.ui.cat = el.dataset.cat; save(); render(); break;
    case 'adopt': adoptAgent(id); break;
    case 'tryAgent': chatWithAgent('tmp_' + id); break;
    case 'openArtifact': openArtifact(id); break;
    case 'delArtifact': {
      db.artifacts = db.artifacts.filter(a => a.id !== id);
      save(); closeModal(); render(); toast('Artifact deleted');
      break;
    }
    case 'toggleDark':
      db.ui.theme = db.ui.theme === 'dark' ? 'light' : 'dark';
      save(); applyTheme(); openSettings();
      break;
    case 'saveAi': {
      const a = aiCfg();
      a.provider = document.getElementById('aiProvider').value;
      a.key = document.getElementById('aiKey').value.trim();
      a.model = document.getElementById('aiModel').value.trim();
      save();
      toast(aiReady() ? 'Live AI connected' : 'Key saved (looks short)');
      openSettings();
      break;
    }
    case 'clearAi': {
      db.ai = {provider:'xai', key:'', model:''};
      save(); toast('Reverted to offline replies'); openSettings(); break;
    }
    case 'exportJson': exportJson(); break;
    case 'resetAll':
      db = clone(seedData());
      save(); applyTheme(); closeModal(); render(); toast('App reset');
      break;
    default: break;
  }
});

/* extra actions that need their own switch entry */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;
  if(act === 'editAgent'){
    closeModal();
    setTimeout(() => editAgentForm(id), 40);
  }
  if(act === 'delAgent'){
    db.agents = db.agents.filter(a => a.id !== id);
    db.teams.forEach(t => { t.members = t.members.filter(m => m !== id); });
    db.chats = db.chats.filter(c => !(c.kind === 'agent' && c.ref === id));
    save(); closeModal(); render(); toast('Agent deleted');
  }
  if(act === 'delTeam'){
    db.teams = db.teams.filter(t => t.id !== id);
    db.chats = db.chats.filter(c => !(c.kind === 'Team' && c.ref === id));
    save(); closeModal(); render(); toast('Team deleted');
  }
  if(act === 'delAuto'){
    db.automations = db.automations.filter(a => a.id !== id);
    save(); closeModal(); render(); toast('Automation deleted');
  }
  if(act === 'delMemory'){
    db.memories = db.memories.filter(m => m.id !== id);
    save(); closeModal(); render(); toast('Memory removed');
  }
  if(act === 'editMemory'){
    const m = byId(db.memories, id);
    if(!m) return;
    closeModal();
    setTimeout(() => openForm({
      title:'Edit memory',
      fields:[{name:'k', label:'Category', value:m.k}, {name:'v', label:'Value', type:'textarea', value:m.v}],
      submit:'Save',
      onSave:v => { m.k = v.k; m.v = v.v; save(); render(); toast('Memory updated'); }
    }), 40);
  }
});

function adoptAgent(id){
  const pool = {
    d1:{name:'SEO Writer', icon:'🔎', desc:'Rank focused articles, briefs and internal linking plans.', skills:['SEO','Briefs']},
    d2:{name:'Brand Designer', icon:'🎯', desc:'Logo systems, palettes and brand guidelines.', skills:['Identity','Palette']},
    d3:{name:'API Builder', icon:'🔌', desc:'REST endpoints, schemas and integration wiring.', skills:['API','Schema']},
    d4:{name:'Sales Closer', icon:'💼', desc:'Objection handling, follow-up sequences and scripts.', skills:['Scripts','Follow-up']},
    d5:{name:'Exam Coach', icon:'📘', desc:'Study plans, mock tests and weak spot drills.', skills:['IELTS','Plan']},
    d6:{name:'Travel Planner', icon:'🧭', desc:'Routes, budgets and day by day itineraries.', skills:['Itinerary','Budget']}
  };
  const p = pool[id];
  if(!p) return;
  if(db.agents.some(a => a.name === p.name)){ toast('Already in your agents'); return; }
  db.agents.push({id:uid('a'), name:p.name, icon:p.icon, role:'Specialist', g:Math.floor(Math.random() * GRADS.length), pinned:false, desc:p.desc, skills:p.skills});
  save(); render(); toast(p.name + ' added');
}

function exportJson(){
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'teamily-backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast('Backup downloaded');
}

/* template agents referenced by tryAgent */
function ensureTryAgent(id){
  const pool = {
    'tmp_d1':{name:'SEO Writer', icon:'🔎', desc:'Rank focused articles and briefs.', skills:['SEO','Briefs']},
    'tmp_d2':{name:'Brand Designer', icon:'🎯', desc:'Logo systems and palettes.', skills:['Identity','Palette']},
    'tmp_d3':{name:'API Builder', icon:'🔌', desc:'REST endpoints and schemas.', skills:['API','Schema']},
    'tmp_d4':{name:'Sales Closer', icon:'💼', desc:'Scripts and follow-up sequences.', skills:['Scripts']},
    'tmp_d5':{name:'Exam Coach', icon:'📘', desc:'Study plans and mock tests.', skills:['IELTS']},
    'tmp_d6':{name:'Travel Planner', icon:'🧭', desc:'Routes, budgets and itineraries.', skills:['Itinerary']}
  };
  if(pool[id] && !byId(db.agents, id)){
    const p = pool[id];
    db.agents.push({id:id, name:p.name, icon:p.icon, role:'Preview', g:Math.floor(Math.random() * GRADS.length), pinned:false, desc:p.desc, skills:p.skills});
    save();
  }
}
const origChatWithAgent = chatWithAgent;
chatWithAgent = function(agentId){
  ensureTryAgent(agentId);
  origChatWithAgent(agentId);
};
